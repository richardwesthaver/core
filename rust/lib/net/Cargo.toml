[package]
name = "net"
version = "0.1.0"
authors = ["ellis"]
edition = "2018"
description = "Network Client/Server Modules"
documentation = "https://docs.rwest.io/kala"
repository = "https://hg.rwest.io/rlib"
publish = ["crater"]

[features]
default = ["client", "server"]
full = ["client", "server", "quic", "http", "dns", "wss", "tun", "tls"]
client = ["reqwest"]
server = ["hyper", "axum", "tower-http"]
http = ["hyper","axum","tower-http","reqwest","oauth2","urlencoding","headers","tower-sessions"]
tls = ["hyper-rustls", "http"]
quic = ["quinn"]
graphql = ["async-graphql-axum", "async-graphql"]
dns = ["hickory-resolver"]
tun = ["tokio-tun"]
ws = ["tokio-tungstenite"]
wss = ["tokio-tungstenite/rustls", "ws"]

[dependencies]
# rlib
obj = { path = "../obj", features = ["oauth"] }
# contrib
futures = "0.3"
bytes = "1.6"
logger = { path = "../logger" }
url = "2.5"
serde_json = "1"
tokio-util = { version = "0.7", features = ["full"] }
tokio = { version = "1.37.0", default-features = false, features = ["net", "io-util"] }
tokio-stream = { version = "0.1.15", features = ["net"] }
## runtimes
quinn = { version = "0.10", features = ["tls-rustls"], optional = true }
hyper = { version = "1.3", optional = true }
hyper-rustls = {version = "0.24", optional = true}
urlencoding = { version = "2.1", optional = true}
reqwest = {version = "0.11", features = ["json", "socks", "rustls-tls", "stream"], optional = true}
axum = {version = "0.7.5", optional = true, features = ["tracing", "macros"] }
headers = {version = "0.4", optional = true}
mime = {version = "0.3.17", optional = true}
async-session = {version = "3.0.0", optional = true}
oauth2 = {version = "4.4.2", optional = true}
tower-http = {version = "0.5", features = ["fs", "trace"], optional = true}
tower-sessions = {version = "0.9", optional = true}
hickory-resolver = {version = "0.24", features = [], optional = true}
tokio-tun = {version = "0.11.4", optional = true}
ipnetwork = "0.20"
tokio-tungstenite = {version = "0.21.0", optional = true}
trait-variant = "0.1.2"
async-graphql-axum = { version = "7.0.3", optional = true }
async-graphql = { version = "7.0.3", optional = true, features = ["dynamic-schema"] }
