[package]
name = "obj"
version = "0.1.0"
authors = ["ellis"]
edition = "2021"
description = "Object-oriented system"
documentation = "https://docs.rwest.io/obj"
repository = "https://hg.rwest.io/rlib"
publish = ["crater"]

[features]
default = []
full = ["vc", "oauth"]
vc = ["hg", "git"]
hg = ["hg-parser"]
git = ["git2"]
oauth = ["yup-oauth2"]
[dependencies]
# rlib
hash = { version = "0.1.0", path = "../hash" }
logger = { version = "0.1.0", path = "../logger" }
# contrib
ron = "0.7.1"
bincode = "1.3.3"
serde_json = "1.0.116"
serde = { version = "1.0.200", features = ["derive"] }
chrono = { version = "0.4.38", features = ["serde"] }
mime = "0.3.17"
hg-parser = { version = "0.6.0", optional = true }
git2 = { version = "0.13.25", default-features = false, optional = true }
regex = "1.10.4"
rusty_ulid = "0.11.0"
uuid = { version = "0.8", features = ["serde"] }
yup-oauth2 = { version = "5.1.0", optional = true }

# required for web frontends
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "0.8", features = ["wasm-bindgen"] }

[dev-dependencies]
tempfile = "3.10.1"
