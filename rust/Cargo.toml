[workspace]
resolver = "2"
members = ["sys/*","lib/*","app/bin/*"]
default-members = ["app/cli/alik"]
[workspace.package]
version = "0.1.0"
authors = ["Richard Westhaver <ellis@rwest.io>"]
edition = "2021"
[profile.release]
lto = true
panic = "abort"
[workspace.dependencies]
tokio = "1.36"
tokio-util = "0.7.10"
tokio-stream = "0.1.14"
serde = "1.0.197"
log = "0.4.20"
bindgen = "0.66.1"