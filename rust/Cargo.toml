[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.package]
version = "0.1.0"
authors = ["Richard Westhaver <ellis@rwest.io>"]
edition = "2021"
[profile.release]
lto = true
panic = "abort"
[workspace.dependencies]
tokio = "1.43"
tokio-util = "0.7.13"
tokio-stream = "0.1.17"
serde = "1.0.217"
log = "0.4.25"
