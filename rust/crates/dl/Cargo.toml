# from rustup
[package]
name = "dl"
version = "1.26.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]

default = ["reqwest-backend", "reqwest-rustls-tls", "reqwest-default-tls"]

curl-backend = ["curl"]
reqwest-backend = ["reqwest", "env_proxy"]
reqwest-default-tls = ["reqwest/default-tls"]
reqwest-rustls-tls = ["reqwest/rustls-tls-native-roots"]

[dependencies]
anyhow = "1.0.95"
curl = { version = "0.4.47", optional = true }
env_proxy = { version = "0.4.1", optional = true }
once_cell = "1.20.3"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "gzip", "socks"], optional = true }
thiserror = "1.0.69"
url = "2.5.4"

[dev-dependencies]
http-body-util = "0.1.2"
hyper = { version = "1.6", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
tempfile = "3.16.0"
tokio = { version = "1.43.0", features = ["sync"] }
