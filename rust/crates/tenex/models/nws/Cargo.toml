[package]
name = "nws"
version = "0.1.0"
edition = "2021"
[lib]
name = "nws"
path = "lib.rs"
[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
log = "0.4.25"
reqwest = { version = "0.11.27", features = ["json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
