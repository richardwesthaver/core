[package]
name = "alik"
version = "0.1.0"
edition = "2021"
description = "Helper of Man"
[[bin]]
name = "alik"
path = "main.rs"
[lib]
path = "lib.rs"
[dependencies]
krypt = { path = "../../lib/krypt" }
util = { path = "../../lib/util", features = ["cli"] }
logger = { path = "../../lib/logger" }
obj = { path = "../../lib/obj" }
net = { path = "../../lib/net", features = ["client", "server", "quic", "dns", "tls", "http", "graphql"] }
db = { path = "../../lib/db", features = ["rocksdb"] }
tenex = { path = "../../lib/tenex" }
tokio = { workspace = true, features = ["full"] }
clap = { version = "4.5.4", features = ["derive","env","string"] }
serde = { workspace = true, features = ["derive"] }
[build-dependencies]
util = { path = "../../lib/util", features = ["bs"] }
