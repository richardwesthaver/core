[package]
name = "util"
version = "0.1.0"
authors = ["ellis"]
edition = "2018"
description = "Rlib Utilities"
documentation = "https://docs.rwest.io/util"
repository = "https://hg.rwest.io/rlib"
publish = ["crater"]

[features]
default = []
full = ["time","cli","bs","url"]
time = ["chrono"]
cli = ["anyhow", "terminal-clipboard", "indicatif", "clap_complete"]
bs = ["platforms"]
[dependencies]
# clap = { version = "4", features = ["wrap_help", "suggestions", "env", "derive", "color", "unicode", "cargo"], optional = true }
chrono = { version = "0.4.41", features = ["serde"] , optional = true}
anyhow = { version = "1.0.98", optional = true }
text_trees = { version = "0.1.2", optional = true }
platforms = { version = "3.5.0", optional = true }
tempfile = { version = "3.19.1", optional = true }
terminal-clipboard = { version = "0.4.1", optional = true }
indicatif = { version = "0.17.11", optional = true }
clap_complete = { version = "4.5.50", optional = true }
url = { version = "2.5.4", optional = true }
# serde = { version = "1", features = ["derive"], optional = true }