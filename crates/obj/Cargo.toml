[package]
name = "obj"
version = "0.1.0"
authors = ["ellis"]
edition = "2021"
description = "Object-oriented system"
documentation = "https://docs.rwest.io/obj"
repository = "https://hg.rwest.io/rlib"
publish = ["crater"]

[features]
default = []
full = ["vc", "oauth"]
vc = ["hg", "git"]
hg = ["hg-parser"]
git = ["git2"]
oauth = ["yup-oauth2"]
[dependencies]
# rlib
hash = { version = "0.1.0", path = "../hash" }
logger = { version = "0.1.0", path = "../logger" }
# contrib
ron = "0.8.1"
bincode = "1.3.3"
serde_json = "1.0.140"
serde = { version = "1.0.218", features = ["derive"] }
chrono = { version = "0.4.40", features = ["serde"] }
mime = "0.3.17"
hg-parser = { version = "0.9.0", optional = true }
git2 = { version = "0.20.0", default-features = false, optional = true }
regex = "1.11.1"
rusty_ulid = "2.0.0"
uuid = { version = "1.15", features = ["serde"] }
yup-oauth2 = { version = "12.1.0", optional = true }

# required for web frontends
# [target.'cfg(target_arch = "wasm32")'.dependencies]
# uuid = { version = "1.13", features = ["wasm-bindgen"] }

[dev-dependencies]
tempfile = "3.17.1"
